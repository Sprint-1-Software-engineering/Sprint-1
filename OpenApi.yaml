openapi: 3.0.3
info:
  title: Online Lecture API
  description: Çevrimiçi ders yönetimi için örnek OpenAPI 3.0 spesifikasyon taslağı.
  version: 1.0.0
  contact:
    name: API Destek Ekibi
    email: support@example.com

servers:
  - url: https://api.example.com/v1
    description: Üretim Sunucusu (Production)
  - url: https://staging-api.example.com/v1
    description: Test Sunucusu (Staging)

paths:
  /lectures:
    get:
      summary: Ders listesini getirir
      description: Sistemdeki dersleri filtreleyerek ve sayfalandırarak listeler.
      operationId: getLectures
      parameters:
        - name: limit
          in: query
          description: Döndürülecek maksimum ders sayısı
          required: false
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          description: Ders kategorisi filtresi
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Başarılı ders listesi yanıtı
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 42
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lecture'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Yeni ders ekler
      operationId: createLecture 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LectureInput'
      responses:
        '201':
          description: Ders başarıyla oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lectures/{lectureId}:
    get:
      summary: Belirli bir dersin detaylarını getirir
      operationId: getLectureById
      parameters:
        - name: lectureId
          in: path
          required: true
          description: Dersin benzersiz kimlik numarası (UUID/ID)
          schema: 
            type: string
      responses:
        '200':
          description: Ders detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lecture'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Lecture:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "prd_12345"
        name:
          type: string
        price:
          type: number
          format: float
          example: 1499.99
        inStock:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-11-04T12:00:00Z"

    LectureInput:
      type: object
      required:
        - lectureName
      properties:
        lectureName:
          type: string
          example: "Veri Bilimi 101"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_INPUT"
        message:
          type: string
          example: "Geçersiz istek parametresi gönderildi."

  responses:
    BadRequest:
      description: Geçersiz istek (Hatalı veri şeması veya eksik alanlar)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Yetkisiz erişim (Yetkilendirme başlığı eksik veya geçersiz)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: İstenen kaynak bulunamadı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Sunucu tarafında beklenmeyen hata oluştu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'