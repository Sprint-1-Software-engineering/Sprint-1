<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="942" viewBox="0 0 1040 942" role="img" aria-labelledby="title">
<title id="title">Homework sharing and access</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#45645d"/></marker></defs>
<rect width="1040" height="942" rx="20" fill="#eef5f2"/>
<text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142c2b">Homework sharing and access</text>
<path d="M250 115V165" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="65" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Teacher selects a student and attaches a file</text>
<path d="M250 215V265" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="273" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c36">Yes</text>
<path d="M474 190H704" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Validation failed</text>
<rect x="706" y="162" width="300" height="56" rx="9" fill="#faece9" stroke="#b77f75"/>
<text x="856" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Correct the recipient or file and</text>
<text x="856" y="203.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">retry</text>
<path d="M26 190L57 165H443L474 190L443 215H57Z" fill="#d9eee6" stroke="#579687"/>
<text x="250" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Connected student and valid file?</text>
<path d="M250 315V365" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="265" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Assignment shared</text>
<path d="M250 415V465" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="365" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Student opens assignment link</text>
<path d="M250 515V565" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="273" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c36">Yes</text>
<path d="M474 490H704" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Access denied</text>
<rect x="706" y="462" width="300" height="56" rx="9" fill="#faece9" stroke="#b77f75"/>
<text x="856" y="486.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Return to Assignments. Hide all</text>
<text x="856" y="503.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">assignment details.</text>
<path d="M26 490L57 465H443L474 490L443 515H57Z" fill="#d9eee6" stroke="#579687"/>
<text x="250" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Authorized to view assignment details?</text>
<path d="M250 615V665" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="565" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Show details and the Download action</text>
<path d="M250 715V765" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="665" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Student selects Download</text>
<path d="M250 815V865" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="273" y="844" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c36">Yes</text>
<path d="M474 790H704" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="780" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Access denied</text>
<rect x="706" y="762" width="300" height="56" rx="9" fill="#faece9" stroke="#b77f75"/>
<text x="856" y="786.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Return to Assignments. Do not</text>
<text x="856" y="803.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">return the file.</text>
<path d="M26 790L57 765H443L474 790L443 815H57Z" fill="#d9eee6" stroke="#579687"/>
<text x="250" y="795" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Still authorized to download this file?</text>
<rect x="26" y="865" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="895" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Serve file through protected download</text>
</svg>
