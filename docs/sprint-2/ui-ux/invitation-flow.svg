<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="642" viewBox="0 0 1040 642" role="img" aria-labelledby="title">
<title id="title">Invitation and connection</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#45645d"/></marker></defs>
<rect width="1040" height="642" rx="20" fill="#eef5f2"/>
<text x="28" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142c2b">Invitation and connection</text>
<path d="M250 115V165" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="65" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Teacher enters student email</text>
<path d="M250 215V265" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="273" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c36">Yes</text>
<path d="M474 190H704" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Invalid or connected</text>
<rect x="706" y="162" width="300" height="56" rx="9" fill="#faece9" stroke="#b77f75"/>
<text x="856" y="186.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Correct the email or open the</text>
<text x="856" y="203.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">existing connection</text>
<path d="M26 190L57 165H443L474 190L443 215H57Z" fill="#d9eee6" stroke="#579687"/>
<text x="250" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Can an invitation be created?</text>
<path d="M250 315V365" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="265" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Teacher shares the single-use code</text>
<path d="M250 415V465" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="26" y="365" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Student signs in and enters the code</text>
<path d="M250 515V565" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="273" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#173c36">Yes</text>
<path d="M474 490H704" fill="none" stroke="#45645d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="589" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Code rejected</text>
<rect x="706" y="462" width="300" height="56" rx="9" fill="#faece9" stroke="#b77f75"/>
<text x="856" y="486.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">Check the account email or ask for</text>
<text x="856" y="503.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#173c36">a fresh code</text>
<path d="M26 490L57 465H443L474 490L443 515H57Z" fill="#d9eee6" stroke="#579687"/>
<text x="250" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Code valid for the signed-in account?</text>
<rect x="26" y="565" width="448" height="50" rx="9" fill="white" stroke="#9bb9ae"/>
<text x="250" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#173c36">Connection created and code consumed</text>
</svg>
