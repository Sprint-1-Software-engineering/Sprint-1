name: Sprint 1 validation
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    name: Sprint 1 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/check_submission.py
      - name: Package review documents
        run: git archive --format=zip --prefix=TutorBridge-Sprint1-review/ --output=TutorBridge-Sprint1-review.zip HEAD README.md LICENSE.md CONTRIBUTIONS.md requirements-docs.txt docs scripts .github src
      - uses: actions/upload-artifact@v4
        with:
          name: sprint1-review-documents
          path: TutorBridge-Sprint1-review.zip
          retention-days: 14
